  <section>
    <h3>openBIS and Data Store core Data Model</h3>
    <p>
      This tutorial uses the core openBIS data model, which consists of five hierarchically structured levels: <strong>Space / Project / Collection / Object / Dataset</strong> applied to three compartments of the Data Store (BAM Inventory, FB Inventory and ELN).
       In this tutorial, you will work with BAM Inventory and the FB Inventory.
    </p>

      <div class="warning">
      <strong>Important Note:</strong> 
      <ul>
        <p>
          Starting with openBIS version 20.10.12, the core data model was extended to include folders and subfolders. Although this feature may provide additional flexibility and resemble the folder structures
           commonly used in Windows file systems, the Data Store team recommends primarily using the core openBIS data model (Project → Collection → Object → Dataset) instead of organizing data through folders.
        </p>
            This recommendation is based on the following advantages:
        <p>
        <li>Maintaining a lean and clear organization of objects within collections.</li>
        <li>Keeping the left-hand Lab Notebook menu concise and easier to navigate.</li>
        <li>Improving the consistency and discoverability of research data.</li>
        <li>Supporting standardized and scalable data organization across projects and divisions.</li>
        <li>Encouraging the use of metadata and object relationships instead of file-system-like structures.</li>
        </p>
            For most research workflows, representing data in Collections and connecting related objects (for example Instruments, chemicals and samples with  experimental steps) using parent–child relationships provides a more robust and sustainable approach than using nested folder structures.
        </li>
  </div>

    <p>
      In openBIS everything is represented as <strong>objects</strong>. In this tutorial, the inventory objects used for the research project named 'Material Synthesis' are organized in several <strong>collections</strong> within the FB and the BAM Inventory.  These collections are named logically to organize Instruments and Chemicals  used in the research workflow of this tutorial example.
    </p>

      <img src="images\data-model.png" alt="Diagram showing  experimental steps and datasets organized in the ELN">

        Figure 2: All items ("things you have") and ("things you generate") for this tutorial example, are represented as inventory objects of BAM Inventory (Instruments) and FB Inventory (Chemicals).
      </figcaption>
    </figure>
  </section>


  <section id="Inventory">
    <h2>Inventory</h2>
    <p>
      The <strong>Inventory</strong> sections for the Data Store are <strong>FB Inventory</strong> and <strong>BAM Inventory</strong>. Objects registered in the FB Inventory are visible to all division members, while objects registered in the BAM Inventory are visible to all BAM members with access to the Data Store. 
    </p> 
    <p>
      Each division has four workspaces (<strong>Spaces</strong> in openBIS); Equipment, Materials, Methods and Publications in FB and BAM Inventory. These Spaces are labeled as X.1 Equipment (in FB Inventory) and as BAM Equipment (in BAM Inventory) with an additional sub-level (openBIS project) labeled with the division number <strong>X.1 Equipment Open</strong>, <strong>X.1 Materials Open</strong>, etc.
    </p>
    <p> 
      The inventory <strong>Spaces</strong> are used to organize "things you have" (Figure 1), tangible or non-tangible. For example, equipment, materials, methods (standard operating Procedures /SOP) used in workflows to generate research data must be registered in the Data Store. Note that within the Inventory Spaces, you find a Space called <strong>Publications</strong>. The use of this Space is optional and does not replace the purpose of the BAM database <strong>Publica</strong> to store publications metadata.
    </p>
     Not all inventory items of a division must be registered in the Data Store, but those instrument, Chemicals, Samples, etc. from which information (metadata) is required to reproduce the research data generated with them. 
    <p>
      In standardization processes, for example, the calibration date (metadata-property) of an instrument, is required for certification and evaluation. Therefore, instruments used in these workflows must be registered and linked to  experimental steps in the Data Store.
      These connections are established through user-defined parent-child relationships.
    </p>
      
    <p>In this tutorial, users with <strong>Group Admin</strong> role and corresponding rights in the Data Store will learn how to register objects in the BAM and FB inventory and how to manage access to these objects to enable collaborators to link them with objects registered in their inventory and ELN.</p>
    </section>

    <h3>General information</h3>
    <p>This section provides guidance for completing the openBIS project form.</p>

    <strong>Code requirements</strong>
    <ul>
      <li>Mandatory fields in openBIS are marked with an asterisk (*).</li>
      <li>Allowed characters: uppercase letters A-Z, digits 0-9, underscore (<code>_</code>), hyphen (<code>-</code>), and dot (<code>.</code>).</li>
      <li>Separate words with underscores.</li>
      <li>Codes should be meaningful, in English, and between 3 and 30 characters.</li>
      <li>A code cannot be modified or reused.</li>
    </ul>

    <strong>Description requirements</strong>
    <ul>
      <li>Mandatory for BAM Data Store.</li>
      <li>Should contain enough detail to be understandable to people outside the group.</li>
      <li>Should follow the format: English//German.</li>
      <li>Should contain 2 to 50 words.</li>
    </ul>

  <section class="step" id="step-2">
    <h2>Step 2: Register Inventory Collections in BAM and FB Inventory</h2>
    <p>
      A project can contain multiple collections to organize inventory items used to generate research data. Collections provide a logical structure for grouping
       objects and facilitate navigation, data management, and data retrieval.  In this tutorial example, you will create collections to organize objects of the same type.
    </p>
    <div class="placeholder">
      <strong>Instructions for Creating a Collection:</strong>
      <ol>
      <li>In the left-hand navigation menu, navigate to Inventory Space (<strong>Space Name</strong> follow list below)</li>  
      <li>Select the openBIS project you want to organize collections (<strong>Project Name</strong> follow list below)</li>
      <li>Click <strong>+ Other</strong></li>
      <li>From the drop-down menu, Select <strong>Collection</strong></li>
      <li>Leave autogenerated <strong>Code(*)</strong> unchanged</li>
      <li>Enter (<strong>Collection Name</strong> listed in table below)</li>
      <li>Select an Object type from the <strong>Default object type</strong> drop-down menu (<strong>Object Type</strong> follow list below)</li>
      <li>Select <strong>List view</strong> as the <strong>Default collection view</strong></li>
      <li>Review all entries and click <strong>Save</strong></li>
      </ol>
    </div>

    <h3>General information</h3>
    <p>It is possible to register openBIS collections with or without a predefined object type If you define an object type, as indicated above, all objects registered in this collection must be of the same type. If you leave the object type empty, you can register objects of different types within the same collection. However, it is often more intuitive and easier to manage when objects of the same type are grouped together.
      In addition, if you define an object type, a <strong>+ Object Type</strong> button will be displayed in the collection view, which allow users to register new objects of the defined type directly from the collection view. If you leave the object type empty, instead a <strong>+ Sample</strong> button will be displayed.</p>

  <section class="step" id="step-3">
    <h2>Step 3: Register Inventory Objects</h2>
    <p>
      Any inventory item, tangible (instruments, samples, etc.) or non-tangible (Standard Operating Procedures/SOP, software, etc.) are represented in openBIS as Objects with user defined Properties (Object Type).  
      In this tutorial, we will register objects of the type <strong>Chemical</strong> in the FB Inventory and <strong>Instrument</strong> in the BAM-inventory.

    </p>
    <div class="placeholder">
      <strong>Instructions for registering Objects in the inventory:</strong>
      <ol>
      <li>In the left-hand menu, navigate to the <strong>Collection name</strong> you want to use to register the objects as indicated in the list below</li>
      <li>Open the <strong>More</strong> drop-down menu and select <strong>XLS Batch Register Objects</strong></li>
      <li>In the <strong>Register Objects</strong> window, click on <strong>Datei auswählen</strong>, select the Excel file containing the objects to register as indicated in the list below</li>
      <li>Review the name displayed for the uploaded Excel file and click the <strong>Accept</strong> tab</li>
      <li>Registered objects will be displayed within each corresponding collection as indicated in the list below.  To display them, navigate to the corresponding collection in the left menu</li>
      <li>Repeat the process to register <strong>Chemicals</strong> and <strong>Instruments</strong> as displayed in the list below</li>
    </ol>
  </div>

    <h3>General information</h3>
    <p>Batch registration enables to register more than one object at a time. In a separate tutorial we will be using the <strong>Batch update</strong> option to update existing objects. If you want to register a single object, instead of clicking on the <strong>More</strong> drop-down menu, select the <strong>+Chemical</strong> or <strong>+Instrument</strong> button, complete the object form and Save.</p>

<section class="step" id="step-4">
    <h2>Step 4: Manage access to inventory objects</h2>
    <p>
      Data Store Stewards (DSSts) can manage access to inventory objects for their division.  This is important so that colleagues and other contributors can link inventory objects to the  experimental steps registered in their ELN.
      DSSts can only manage access to the FB-inventory, not the BAM-inventory (by default, all Data Store users have access to all objects). Other division members cannot manage access to the FB-inventory.
      For detailed information on the roles and rights defined per default in the Data Store, see the contents <strong>Rights and Roles in the Data Store</strong> in the Data Store wiki (only available to BAM members).
      
      
    </p>
  <div class="placeholder">
      <strong>Instructions to manage access of the FB Inventory:</strong>
      <ol>
      <li>In the left-hand menu, click on the openBIS project <strong>Chemicals Synthesis</strong></li>
      <li>Click on the <strong>More</strong> drop-down menu and select <strong>Manage access</strong></li>
      <li>Select <strong>User</strong> from the <strong>Role</strong> drop-down menu</li>
      <li>Select <strong>Group</strong> from the <strong>grant to</strong> drop-down menu</li>
      <li>In the <strong>Group or User</strong> field write your division number</li>
      <li>Click on the <strong>Grant access</strong> tab</li>  
      </ol>
  </div>

     <h3>General information</h3>
    <p>Access assigned to an openBIS Space or Project within the FB Inventory can be reverted or changed by division members assigned by default with the <strong>Group Admin</strong> role in the Data Store. All other members assigned by default with <strong>User</strong> role, do not have sufficient rights to do so.
